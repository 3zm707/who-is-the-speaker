<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Who's the speaker</title>
<style>
:root{--bg-deep:#030712;--surface:#0f172a;--accent-glow:#6366f1;--accent-pink:#ec4899;--text-main:#f8fafc;--text-sub:#94a3b8;--success-color:#10b981;--border-color:rgba(255,255,255,.08);--role-speaker:#f43f5e;--role-khawi:#0ea5e9;--role-impostor:#f59e0b;--role-guesser:#8b5cf6}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{background:var(--bg-deep);color:var(--text-main);min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
.cyber-header{width:100%;background:linear-gradient(90deg,#0f172a,#1e1b4b);border-bottom:2px solid var(--accent-glow);padding:15px 30px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 10px 25px rgba(99,102,241,.2)}
.cyber-logo-group{display:flex;flex-direction:column}
.cyber-title-ar{font-size:22px;font-weight:900}
.cyber-title-en{font-size:13px;color:var(--accent-glow);font-weight:bold;text-transform:uppercase}
.cyber-nav-btns{display:flex;gap:15px}
.cyber-btn{background:rgba(99,102,241,.1);border:1px solid var(--accent-glow);color:#fff;padding:8px 18px;border-radius:6px;font-size:14px;font-weight:bold;cursor:pointer;transition:all .3s}
.cyber-btn:hover{background:var(--accent-glow);box-shadow:0 0 15px var(--accent-glow)}
.main-viewport{flex:1;width:100%;max-width:1200px;margin:0 auto;padding:30px 20px;display:flex;flex-direction:column;justify-content:center}
.game-panel{background:var(--surface);border:1px solid var(--border-color);border-radius:16px;padding:40px;box-shadow:0 20px 40px rgba(0,0,0,.5)}
h1,h2{margin-bottom:20px;text-align:start}
h1{font-size:30px;border-inline-start:4px solid var(--accent-glow);padding-inline-start:15px}
p{color:var(--text-sub);margin-bottom:20px;font-size:16px;text-align:start}
.arcade-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:25px;margin-top:20px}
.arcade-card{background:linear-gradient(135deg,#1e293b,#0f172a);border:2px solid var(--border-color);border-radius:14px;padding:30px;transition:all .4s;cursor:pointer}
.arcade-card:hover{border-color:var(--accent-glow);transform:translateY(-5px);box-shadow:0 15px 30px rgba(99,102,241,.3)}
.arcade-card h3{font-size:24px;margin-bottom:12px}
.arcade-card p{font-size:14px}
.card-action-bar{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border-color);padding-top:15px}
.rules-trigger{background:transparent;border:none;color:var(--accent-pink);font-weight:bold;font-size:14px;cursor:pointer;text-decoration:underline}
.input-box-group{margin-bottom:20px}
.input-box-group label{display:block;margin-bottom:8px;color:var(--text-sub);font-weight:bold}
input[type=text]{width:100%;padding:16px 20px;background:#030712;border:2px solid var(--border-color);color:#fff;border-radius:10px;font-size:16px;outline:none}
input[type=text]:focus{border-color:var(--accent-glow)}
.action-main-btn{width:100%;padding:16px;background:linear-gradient(135deg,var(--accent-glow),var(--accent-pink));color:#fff;border:none;border-radius:10px;font-size:18px;font-weight:bold;cursor:pointer;box-shadow:0 5px 15px rgba(99,102,241,.4)}
.action-main-btn:hover{filter:brightness(1.15)}
.action-sec-btn{background:transparent;border:2px solid var(--border-color);color:var(--text-main);padding:14px;width:100%;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:10px}
.action-sec-btn:hover{background:rgba(255,255,255,.05)}
.hidden{display:none!important}
.room-code-badge{font-size:32px;letter-spacing:5px;color:var(--success-color);background:#030712;padding:15px;border-radius:10px;text-align:center;border:2px dashed var(--success-color);margin:20px 0;font-weight:900}
.players-container{list-style:none;background:#030712;border:1px solid var(--border-color);border-radius:10px;padding:15px;max-height:200px;overflow-y:auto;margin-bottom:20px}
.player-row{padding:10px 15px;border-bottom:1px solid var(--border-color);display:flex;justify-content:space-between;align-items:center}
.player-row:last-child{border-bottom:none}
.badge{background:var(--accent-glow);padding:2px 8px;border-radius:4px;font-size:12px;font-weight:bold}
.role-display-box{background:linear-gradient(135deg,#0f172a,#1e293b);border:2px solid var(--accent-glow);border-radius:14px;padding:30px;text-align:center;margin-bottom:25px}
.role-highlight-title{font-size:32px;font-weight:900;margin-bottom:10px}
.chat-box-wrapper{background:#030712;border:1px solid var(--border-color);border-radius:10px;padding:15px;margin:20px 0}
.chat-scroll-area{height:160px;overflow-y:auto;margin-bottom:10px;display:flex;flex-direction:column;gap:6px}
.chat-bubble{background:#1e293b;padding:8px 12px;border-radius:8px;font-size:14px;word-break:break-word}
.chat-bubble b{color:var(--accent-glow);margin-inline-end:6px}
.chat-bubble.sys{background:rgba(245,158,11,.1);color:#fcd34d}
.chat-input-row{display:flex;gap:10px}
.chat-input-row button{width:auto;padding:10px 20px;font-size:14px}
.waiting-banner{background:rgba(245,158,11,.1);border:2px dashed var(--role-impostor);border-radius:10px;padding:15px;text-align:center;color:#fcd34d;font-weight:bold;margin:15px 0}
.game-rules-box,.rules-text{white-space:pre-line;line-height:1.8;font-size:14px;color:var(--text-sub);text-align:start}
.game-rules-box{background:#030712;border:1px solid var(--accent-pink);border-radius:10px;padding:15px;margin-top:15px}
#conn{position:fixed;bottom:10px;inset-inline-start:10px;font-size:12px;color:#fcd34d}
@media(max-width:600px){.game-panel{padding:22px}.cyber-header{padding:12px 15px}}
</style>
</head>
<body>
<header id="top-bar-container" class="cyber-header hidden">
  <div class="cyber-logo-group">
    <span class="cyber-title-ar" data-i18n="topAr"></span>
    <span class="cyber-title-en">Who's the speaker</span>
  </div>
  <div class="cyber-nav-btns">
    <button class="cyber-btn" onclick="openRules()" data-i18n="btnRules"></button>
    <button class="cyber-btn" onclick="toggleLang()" data-i18n="btnLang"></button>
  </div>
</header>

<main class="main-viewport">
  <section id="screen-home" class="game-panel">
    <h1 data-i18n="homeMain"></h1>
    <p data-i18n="homeSub"></p>
    <div class="arcade-grid">
      <div class="arcade-card">
        <div onclick="show('screen-welcome')">
          <h3 data-i18n="gameTitle"></h3>
          <p data-i18n="gameDesc"></p>
        </div>
        <div class="card-action-bar">
          <button class="rules-trigger" onclick="document.getElementById('rules-inline').classList.toggle('hidden')" data-i18n="rulesBtn"></button>
          <button class="cyber-btn" onclick="show('screen-welcome')" style="padding:6px 15px;font-size:13px" data-i18n="playNow"></button>
        </div>
        <div id="rules-inline" class="game-rules-box hidden"></div>
      </div>
      <div class="arcade-card" style="opacity:.4;cursor:not-allowed">
        <h3 data-i18n="soonTitle"></h3>
        <p data-i18n="soonDesc"></p>
      </div>
    </div>
  </section>

  <section id="screen-welcome" class="game-panel hidden">
    <h1 data-i18n="gameTitle"></h1>
    <p data-i18n="welSub"></p>
    <div class="input-box-group">
      <label for="username" data-i18n="welName"></label>
      <input type="text" id="username" maxlength="20" data-ph="namePh">
    </div>
    <button class="action-main-btn" onclick="createRoom()" data-i18n="welCreate"></button>
    <button class="action-sec-btn" onclick="goJoin()" data-i18n="welJoin"></button>
    <button class="action-sec-btn" onclick="show('screen-home')" style="color:var(--accent-glow)" data-i18n="welBack"></button>
  </section>

  <section id="screen-join" class="game-panel hidden">
    <h2 data-i18n="joinHead"></h2>
    <div class="input-box-group">
      <label for="room-code-input" data-i18n="joinCode"></label>
      <input type="text" id="room-code-input" maxlength="10" data-ph="codePh">
    </div>
    <button class="action-main-btn" onclick="joinRoom()" data-i18n="joinBtn"></button>
    <button class="action-sec-btn" onclick="show('screen-welcome')" data-i18n="joinBack"></button>
  </section>

  <section id="screen-lobby" class="game-panel hidden">
    <h2 data-i18n="lobbyHead"></h2>
    <p data-i18n="lobbySub"></p>
    <div class="room-code-badge" id="room-code">-----</div>
    <label data-i18n="lobbyPlayers" style="display:block;margin-bottom:8px;color:var(--text-sub)"></label>
    <ul id="lobby-players" class="players-container"></ul>
    <div class="chat-box-wrapper">
      <label data-i18n="chatLabel" style="font-size:13px;color:var(--text-sub);display:block;margin-bottom:5px"></label>
      <div class="chat-scroll-area" data-chat></div>
      <div class="chat-input-row">
        <input type="text" data-chat-input data-ph="chatPh" maxlength="300">
        <button class="action-main-btn" data-chat-send data-i18n="chatSend"></button>
      </div>
    </div>
    <div id="host-controls" class="hidden"><button class="action-main-btn" onclick="socket.emit('startGame')" data-i18n="startBtn"></button></div>
    <p id="waiting-host" class="hidden" style="text-align:center" data-i18n="waitHost"></p>
    <button class="action-sec-btn" onclick="leaveRoom()" style="color:var(--accent-pink)" data-i18n="leaveBtn"></button>
  </section>

  <section id="screen-game" class="game-panel hidden">
    <h2 data-i18n="gamePhaseHead"></h2>
    <div class="role-display-box" id="role-box">
      <div class="role-highlight-title" id="role-name"></div>
      <p id="role-desc" style="font-size:17px;margin-bottom:0;text-align:center"></p>
    </div>
    <div id="clue-section" class="hidden">
      <div class="input-box-group">
        <label id="clue-label"></label>
        <input type="text" id="clue-input" maxlength="100" data-ph="cluePh">
      </div>
      <button class="action-main-btn" id="clue-btn" onclick="submitClue()"></button>
    </div>
    <div id="waiting-clue" class="waiting-banner hidden" data-i18n="waitingBanner"></div>
    <div id="clue-display" class="hidden" style="text-align:center;margin:20px 0">
      <p><strong data-i18n="clueSent"></strong> <span id="clue-text" style="color:var(--success-color);font-size:22px;font-weight:bold"></span></p>
    </div>
    <div class="chat-box-wrapper">
      <label data-i18n="chatDiscuss" style="font-size:13px;color:var(--text-sub);display:block;margin-bottom:5px"></label>
      <div class="chat-scroll-area" data-chat></div>
      <div class="chat-input-row">
        <input type="text" data-chat-input data-ph="discussPh" maxlength="300">
        <button class="action-main-btn" data-chat-send data-i18n="chatSend"></button>
      </div>
    </div>
    <div class="chat-box-wrapper" style="text-align:center;background:rgba(16,185,129,.05);border-color:rgba(16,185,129,.2)">
      <p data-i18n="readyAsk" style="text-align:center;font-size:14px;margin-bottom:10px"></p>
      <button id="ready-btn" onclick="socket.emit('toggleReady')" style="width:100%;padding:12px;border:none;border-radius:8px;font-weight:bold;cursor:pointer"></button>
      <div id="ready-count" style="margin-top:8px;font-size:13px;color:var(--success-color)"></div>
    </div>
  </section>

  <section id="screen-voting" class="game-panel hidden">
    <h2 data-i18n="voteHead"></h2>
    <p data-i18n="voteSub"></p>
    <div id="vote-status" style="text-align:center;margin-bottom:20px;color:var(--success-color);font-weight:bold"></div>
    <div id="vote-buttons" style="display:flex;flex-direction:column;gap:12px;margin:20px 0"></div>
  </section>

  <section id="screen-results" class="game-panel hidden">
    <h2 data-i18n="resHead"></h2>
    <div class="role-display-box" style="padding:25px">
      <p style="font-size:18px;text-align:center"><strong data-i18n="resSpeaker"></strong>: <span id="res-speaker" style="color:var(--role-speaker);font-weight:bold"></span></p>
      <p style="font-size:18px;text-align:center"><strong data-i18n="resImpostor"></strong>: <span id="res-impostor" style="color:var(--role-impostor);font-weight:bold"></span></p>
      <p style="font-size:18px;margin-bottom:0;text-align:center"><strong data-i18n="resKhawi"></strong>: <span id="res-khawi" style="color:var(--role-khawi);font-weight:bold"></span></p>
    </div>
    <h3 data-i18n="resScores" style="margin-top:25px"></h3>
    <ul id="scores" class="players-container" style="margin-top:10px"></ul>
    <div id="host-results" class="hidden"><button class="action-main-btn" onclick="socket.emit('resetGame')" data-i18n="resAgain"></button></div>
    <p id="waiting-host-2" class="hidden" style="text-align:center" data-i18n="waitHost"></p>
    <button class="action-sec-btn" onclick="leaveRoom()" style="color:var(--accent-pink)" data-i18n="leaveBtn"></button>
  </section>
</main>

<div id="rules-modal" class="hidden" style="position:fixed;inset:0;background:rgba(3,7,18,.85);display:flex;justify-content:center;align-items:center;z-index:1000;padding:20px">
  <div class="game-panel" style="max-width:600px;width:100%;max-height:80vh;overflow-y:auto;border-color:var(--accent-glow)">
    <h2 data-i18n="modalTitle" style="color:var(--accent-glow)"></h2>
    <div class="rules-text" id="rules-modal-text"></div>
    <button class="action-main-btn" onclick="closeRules()" style="margin-top:20px" data-i18n="modalClose"></button>
  </div>
</div>
<div id="conn" class="hidden"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const RULES_AR = `🎮 شرح لعبة من المتحدث

نبذة عن اللعبة
لعبة جماعية حماسية تعتمد على الذكاء، الخداع، والاستنتاج الاجتماعي. تجمع الأصدقاء في منافسة مليئة بالضحك والتحدي لكشف الأسرار ومعرفة من هو المتحدث الحقيقي وسط زحمة التخمينات!

القواعد الأساسية
- عدد اللاعبين: تلعب بحد أدنى 4 لاعبين لضمان متعة المنافسة وتنوع الأدوار.
- الأدوار السرية: عند بدء الجولة، يتم توزيع الأدوار بشكل عشوائي وسري على جميع اللاعبين:
  1. المتحدث: شخص يعرف هوية الخوي، وهدفه إرسال تلميح ذكي بحيث لا يصوت عليه إلا الخوي وحده دون أن يكتشفه البقية.
  2. الخوي: يعرف أنه الخوي لكنه لا يعرف من هو المتحدث، وهدفه معرفة من هو المتحدث الذي يقصده بهذا التلميح.
  3. المزيف (الإمبوستر): لا يعرف المتحدث ولا الخوي، وهدفه الأكبر هو تقمص دور المتحدث وجعل الجميع يصوتون عليه.
  4. المخمنون: باقي اللاعبين وهدفهم تحليل التلميحات، مناقشة الأصدقاء، وكشف المتحدث والمزيف بدقة لتحقيق أعلى النقاط.

مراحل اللعبة
1. مرحلة التلميح الأول: يبدأ المتحدث بكتابة تلميحه الأساسي بحذر.
2. مرحلة التلميح الثاني (تلميح آخر): يحق للمتحدث إرسال تلميح إضافي واحد فقط (بحد أقصى تلميحين في الجولة كاملة).
3. مرحلة النقاش: ينتقل الأصدقاء للنقاش الحر لتحليل الكلمات والشكوك.
4. مرحلة التصويت: يشارك الجميع بلا استثناء في التصويت لاختيار الشخص المشكوك فيه.
5. مرحلة النتائج: يتم الكشف عن الأدوار السرية وعرض جدول النقاط النهائي.`;

const RULES_EN = `🎮 How to play "Who's the speaker"

About
A fun social game of wit, bluffing and deduction. Friends compete to uncover who the real speaker is amid all the guesses!

Basic rules
- Players: at least 4 players.
- Secret roles, assigned randomly at the start of each round:
  1. Speaker: knows who the Khawi is and sends a clever clue so that only the Khawi votes for them, without the others noticing.
  2. Khawi: knows they are the Khawi but not who the speaker is. Their goal is to work out who the clue came from.
  3. Impostor: knows neither the speaker nor the Khawi. Their goal is to pose as the speaker and get everyone to vote for them.
  4. Guessers: everyone else. Analyze the clues, discuss, and expose the speaker and the impostor.

Phases
1. First clue: the speaker writes the main clue.
2. Second clue: the speaker may send one extra clue (max 2 per round).
3. Discussion: friends discuss freely.
4. Voting: everyone votes for the person they suspect.
5. Results: roles are revealed and the scoreboard is shown.`;

 namePh:'اكتب اسمك المميز هنا...',codePh:'أدخل رمز الغرفة...',chatPh:'اكتب رسالتك...',cluePh:'اكتب تلميحك هنا...',discussPh:'تناقش مع أصدقائك...',
 host:'المضيف',pts:'نقاط',ready:'المستعدون',voted:'تم التصويت',ofPlayers:'من اللاعبين',roleLabel:'دورك: ',yourVote:' (صوتك الحالي)',voteFor:'تصويت لصالح ',sys:'النظام',
 clueLbl1:'أرسل التلميح',clueLbl2:'أرسل تلميحاً آخر',clueBtn1:'إرسال التلميح',clueBtn2:'أرسل تلميحاً آخر',
 roles:{speaker:'المتحدث',khawi:'الخوي',impostor:'المزيف',guesser:'المخمن'},
 desc:{guesser:'هدفك هو تخمين المتحدث الحقيقي لتحصل على النقاط.',speaker:k=>`أنت تعرف الخوي وهو ${k}. أرسل تلميحاً ذكياً ليصوت عليك الخوي وحده!`,khawi:'أنت الخوي المميز! ركز في التلميح لتعرف من هو المتحدث وتقوم بالتصويت له.',impostor:'أنت المزيف! حاول تقمص دور المتحدث وجعل الجميع يظنون أنهم يعرفونك.'},
 clueMsg:(w,t)=>`قام ${w} بإرسال التلميح: ${t}`,
 err:{name:'اكتب اسمك أولاً!',code:'أدخل رمز الغرفة!',notfound:'رمز الغرفة غير موجود!',taken:'هذا الاسم مستخدم في الغرفة!',started:'اللعبة بدأت بالفعل!',minPlayers:'يجب ألا يقل عدد اللاعبين عن 4!',clue:'اكتب التلميح أولاً!'},
 rules:RULES_AR},
en:{topAr:'من المتحدث؟',btnRules:'Rules',btnLang:'عربي',homeMain:'Party Games Platform',homeSub:'Choose a game and start the fun with friends',gameTitle:"Who's the speaker",gameDesc:'Social deduction game with live chat (Speaker, Impostor, Khawi, Guessers).',rulesBtn:'Show Rules',playNow:'Play now',soonTitle:'Coming Soon (New Game)',soonDesc:'Stay tuned for more exciting multiplayer games...',welSub:'Enter your name and get ready to challenge your friends!',welName:'Player Name',welCreate:'Create Room (Host)',welJoin:'Join Room',welBack:'← Back to Home',joinHead:'Join Room',joinCode:'Room Code',joinBtn:'Enter Room',joinBack:'Back',lobbyHead:'Lobby',lobbySub:'Share the room code with your friends (min 4 players)',lobbyPlayers:'Joined Players',chatLabel:'Group Chat',chatSend:'Send',startBtn:'Start Game',waitHost:'Waiting for host...',leaveBtn:'← Leave Room',gamePhaseHead:'Clue & Discussion Phase',clueSent:'Sent Clue',chatDiscuss:'Discussion Chat 💬',readyAsk:'Are you done discussing and ready to vote?',readyBtn:"I'm Ready to Vote 👍",readyCancel:'Ready (Cancel)',voteHead:'Voting Phase',voteSub:'Choose the player you suspect',resHead:'Game Results',resSpeaker:'Speaker',resImpostor:'Impostor',resKhawi:'Khawi',resScores:'Scoreboard',resAgain:'Play Again (Host Only)',modalTitle:'Game Rules',modalClose:'Close',waitingBanner:'⏳ Waiting for the speaker to write the clue...',
 namePh:'Type your name here...',codePh:'Enter room code...',chatPh:'Type your message...',cluePh:'Type your clue here...',discussPh:'Discuss with your friends...',
 host:'Host',pts:'pts',ready:'Ready',voted:'Voted',ofPlayers:'players',roleLabel:'Your Role: ',yourVote:' (Your vote)',voteFor:'Vote for ',sys:'System',
 clueLbl1:'Send Clue',clueLbl2:'Send another clue',clueBtn1:'Submit Clue',clueBtn2:'Submit another clue',
 roles:{speaker:'Speaker',khawi:'Khawi',impostor:'Impostor',guesser:'Guesser'},
 desc:{guesser:'Your goal is to guess the true speaker to earn points.',speaker:k=>`You know the Khawi is ${k}. Send a smart clue so only the Khawi votes for you!`,khawi:'You are the special Khawi! Focus on the clue to identify the speaker and vote for them.',impostor:'You are the Impostor! Try to mimic the speaker and make everyone think you are them.'},
 clueMsg:(w,t)=>`${w} sent a clue: ${t}`,
 err:{name:'Please enter your name first!',code:'Enter room code!',notfound:'Room not found!',taken:'That name is already used in this room!',started:'The game already started!',minPlayers:'Minimum 4 players required!',clue:'Enter clue first!'},
 rules:RULES_EN}
};

const socket = io();
const $ = (id) => document.getElementById(id);
let lang = 'ar', view = null;
const saved = () => { try { return JSON.parse(sessionStorage.getItem('sess')); } catch (e) { return null; } };
const setSaved = (s) => { try { s ? sessionStorage.setItem('sess', JSON.stringify(s)) : sessionStorage.removeItem('sess'); } catch (e) {} };

function applyStatic() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t[el.dataset.i18n]; });
  document.querySelectorAll('[data-ph]').forEach((el) => { el.placeholder = t[el.dataset.ph]; });
  $('rules-inline').textContent = t.rules;
  $('rules-modal-text').textContent = t.rules;
  if (view) render(view);
}
function toggleLang() { lang = lang === 'ar' ? 'en' : 'ar'; applyStatic(); }
function openRules() { $('rules-modal').classList.remove('hidden'); }
function closeRules() { $('rules-modal').classList.add('hidden'); }

function show(id) {
  document.querySelectorAll('.main-viewport > section').forEach((s) => s.classList.add('hidden'));
  $(id).classList.remove('hidden');
  $('top-bar-container').classList.toggle('hidden', id === 'screen-home');
}
function toast(key) { alert(T[lang].err[key] || key); }
const nameVal = () => $('username').value.trim();

function createRoom() {
  const name = nameVal();
  if (!name) return toast('name');
  socket.emit('createRoom', { name }, (r) => {
    if (r && r.error) return toast(r.error);
    setSaved({ name, code: null });
  });
}
function goJoin() { if (!nameVal()) return toast('name'); show('screen-join'); }
function joinRoom() {
  const name = nameVal(), code = $('room-code-input').value.trim().toUpperCase();
  if (!name) return toast('name');
  if (!code) return toast('code');
  socket.emit('joinRoom', { name, code }, (r) => {
    if (r && r.error) return toast(r.error);
    setSaved({ name, code });
  });
}
function leaveRoom() { socket.emit('leaveRoom'); setSaved(null); view = null; show('screen-home'); }

function submitClue() {
  const v = $('clue-input').value.trim();
  if (!v) return toast('clue');
  socket.emit('submitClue', v);
  $('clue-input').value = '';
}
function sendChat(input) {
  const v = input.value.trim();
  if (!v) return;
  socket.emit('chat', v);
  input.value = '';
}
document.querySelectorAll('[data-chat-input]').forEach((inp) => {
  inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendChat(inp); });
});
document.querySelectorAll('[data-chat-send]').forEach((btn) => {
  btn.addEventListener('click', () => sendChat(btn.parentElement.querySelector('input')));
});

function renderChat(v) {
  const t = T[lang];
  document.querySelectorAll('[data-chat]').forEach((box) => {
    box.innerHTML = '';
    v.messages.forEach((m) => {
      const d = document.createElement('div');
      d.className = 'chat-bubble';
      if (m.sender === '__system__') {
        d.classList.add('sys');
        try { const j = JSON.parse(m.text); d.textContent = t.clueMsg(j.who, j.text); } catch (e) { d.textContent = m.text; }
      } else {
        const b = document.createElement('b'); b.textContent = m.sender;
        d.appendChild(b); d.appendChild(document.createTextNode(m.text));
      }
      box.appendChild(d);
    });
    box.scrollTop = box.scrollHeight;
  });
}

function playerRow(name, extra) {
  const li = document.createElement('li');
  li.className = 'player-row';
  const s = document.createElement('span'); s.textContent = name; li.appendChild(s);
  if (extra) { const b = document.createElement('span'); b.className = 'badge'; b.textContent = extra; li.appendChild(b); }
  return li;
}

function render(v) {
  const t = T[lang];
  const isHost = v.me === v.host;
  renderChat(v);

  if (v.state === 'lobby') {
    show('screen-lobby');
    $('room-code').textContent = v.code;
    const ul = $('lobby-players'); ul.innerHTML = '';
    v.players.forEach((p) => ul.appendChild(playerRow(p.name + (p.connected ? '' : ' …'), p.name === v.host ? t.host : '')));
    $('host-controls').classList.toggle('hidden', !isHost);
    $('waiting-host').classList.toggle('hidden', isHost);
  }

  if (v.state === 'game') {
    show('screen-game');
    const color = { speaker: 'var(--role-speaker)', khawi: 'var(--role-khawi)', impostor: 'var(--role-impostor)', guesser: 'var(--role-guesser)' }[v.role];
    $('role-box').style.borderColor = color;
    $('role-name').style.color = color;
    $('role-name').textContent = t.roleLabel + t.roles[v.role];
    const d = t.desc[v.role];
    $('role-desc').textContent = typeof d === 'function' ? d(v.khawi) : d;
    const canClue = v.role === 'speaker' && v.clueCount < v.maxClues;
    $('clue-section').classList.toggle('hidden', !canClue);
    $('clue-label').textContent = v.clueCount > 0 ? t.clueLbl2 : t.clueLbl1;
    $('clue-btn').textContent = v.clueCount > 0 ? t.clueBtn2 : t.clueBtn1;
    $('waiting-clue').classList.toggle('hidden', !(v.role !== 'speaker' && !v.clue));
    $('clue-display').classList.toggle('hidden', !v.clue);
    $('clue-text').textContent = v.clue;
    const rb = $('ready-btn');
    rb.textContent = v.myReady ? t.readyCancel : t.readyBtn;
    rb.style.background = v.myReady ? '#475569' : 'var(--success-color)';
    rb.style.color = v.myReady ? '#fff' : '#000';
    $('ready-count').textContent = `${t.ready} (${v.readyCount} / ${v.activeCount})`;
  }

  if (v.state === 'voting') {
    show('screen-voting');
    $('vote-status').textContent = `${t.voted} (${v.voteCount} / ${v.activeCount}) ${t.ofPlayers}`;
    const box = $('vote-buttons'); box.innerHTML = '';
    v.players.filter((p) => p.name !== v.me).forEach((p) => {
      const b = document.createElement('button');
      b.className = 'action-sec-btn';
      const mine = v.myVote === p.name;
      if (mine) { b.style.borderColor = 'var(--success-color)'; b.style.background = 'rgba(16,185,129,.15)'; b.style.color = 'var(--success-color)'; }
      b.textContent = t.voteFor + p.name + (mine ? t.yourVote : '');
      b.onclick = () => socket.emit('vote', p.name);
      box.appendChild(b);
    });
  }

  if (v.state === 'results') {
    show('screen-results');
    $('res-speaker').textContent = v.reveal.speaker;
    $('res-impostor').textContent = v.reveal.impostor;
    $('res-khawi').textContent = v.reveal.khawi;
    const ul = $('scores'); ul.innerHTML = '';
    Object.entries(v.finalScores || {}).forEach(([n, s]) => ul.appendChild(playerRow(n, `${s} ${t.pts}`)));
    $('host-results').classList.toggle('hidden', !isHost);
    $('waiting-host-2').classList.toggle('hidden', isHost);
  }
}

socket.on('room', (v) => {
  view = v;
  setSaved({ name: v.me, code: v.code });
  render(v);
});
socket.on('toast', (k) => toast(k));

// Auto-rejoin after a refresh / dropped connection
socket.on('connect', () => {
  $('conn').classList.add('hidden');
  const s = saved();
  if (s && s.code) {
    socket.emit('joinRoom', { name: s.name, code: s.code }, (r) => {
      if (r && r.error) { setSaved(null); view = null; show('screen-home'); }
    });
  }
});
socket.on('disconnect', () => {
  $('conn').textContent = lang === 'ar' ? 'انقطع الاتصال… جاري إعادة المحاولة' : 'Disconnected… retrying';
  $('conn').classList.remove('hidden');
});

applyStatic();
show('screen-home');
</script>
</body>
</html>
